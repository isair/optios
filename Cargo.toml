[package]
name = "optios"
version = "0.1.0"
authors = ["Your Name <you@example.com>"] # TODO: Replace with your info
edition = "2021"

[dependencies]
rlibc = "1.0.0"
# bootloader = { version = "0.9.8", features = ["map_physical_memory"] } # Removed
volatile = "0.2.6"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
spin = "0.5.2"
x86_64 = "0.14.2"
uefi = "0.21.0"
log = "0.4.0"
uefi-services = "0.18.0"

# Graphics dependencies
embedded-graphics = "0.7.1"
uefi-graphics = "0.4.0"

# Define a binary target instead of a library
[[bin]]
name = "optios"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort" 